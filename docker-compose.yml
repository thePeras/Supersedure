version: '3'
volumes:
  mssql:
  mssqllatin:
  mysql:
  mysql8:
  mysql4.1:
  psql96:
  psql14:
  psql13:
  psql15_load_test_data:
  psql17:
  mariadb:
  cockroachdb:
  bigquery:
  redis:
  greengage:
  greengage7:
  starrocks:

services:
  psql15-load-test:
    image: postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: load_test_db
    volumes:
      - psql15_load_test_data:/var/lib/postgresql/data
      - ./dev/docker_psql_load_test_init:/docker-entrypoint-initdb.d
    ports:
      - 5435:5432
    shm_size: 2gb
    command: postgres -c shared_preload_libraries=pg_stat_statements -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB

  psql15:
    image: postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: saklia
    volumes:
      - psql13:/var/lib/postgresql/data
      - ./dev/docker_psql_init:/docker-entrypoint-initdb.d
    ports:
      - 5434:5432

  psql17:
    image: postgres:17
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: saklia
    volumes:
      - psql17:/var/lib/postgresql/data
      - ./dev/docker_psql_init:/docker-entrypoint-initdb.d
    ports:
      - 5437:5432

  psql14:
    image: postgres:14
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: saklia
    volumes:
      - psql14:/var/lib/postgresql/data
      - ./dev/docker_psql_init:/docker-entrypoint-initdb.d
    ports:
      - 5436:5432
  psql13:
    image: postgres:13
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: saklia
    volumes:
      - psql13:/var/lib/postgresql/data
      - ./dev/docker_psql_init:/docker-entrypoint-initdb.d
    ports:
      - 5433:5432
  psql:
    image: postgres:9.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: saklia
    volumes:
      - psql96:/var/lib/postgresql/data
      - ./dev/docker_psql_init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432

  # Greengage DB 6. https://hub.docker.com/r/greengagedb/ggdb6_ubuntu/tags . Demo listens on 6000.
  greengage:
    image: greengagedb/ggdb6_ubuntu:6.29.2
    platform: linux/amd64
    sysctls:
      kernel.sem: "500 1024000 200 4096"
    ports:
      - 5438:6000
    volumes:
      - greengage:/tmp/greengage_data
      - ./dev/docker_greengage/init-and-run.sh:/init-and-run.sh:ro
    command: ["bash", "/init-and-run.sh"]

  # Greengage DB 7. https://hub.docker.com/r/greengagedb/ggdb7_ubuntu/tags . Demo listens on 7000.
  greengage7:
    image: greengagedb/ggdb7_ubuntu:7.4.1
    platform: linux/amd64
    sysctls:
      kernel.sem: "500 1024000 200 4096"
    ports:
      - 5439:7000
    volumes:
      - greengage7:/tmp/greengage_data
      - ./dev/docker_greengage/init-and-run.sh:/init-and-run.sh:ro
    command: ["bash", "/init-and-run.sh"]

  mariadb:
    image: mariadb
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: test
    ports:
      - 3307:3306
    volumes:
      - mariadb:/var/lib/mysql
      - ./dev/docker_mysql_init:/docker-entrypoint-initdb.d
  mysql8:
    image: mysql:8.0.21
    platform: linux/amd64
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: test
    ports:
      - 3308:3306
    volumes:
      - mysql8:/var/lib/mysql
      - ./dev/docker_mysql_init:/docker-entrypoint-initdb.d
  mysql:
    image: mysql:5.7.22
    platform: linux/amd64
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: test
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
      - ./dev/docker_mysql_init:/docker-entrypoint-initdb.d
  mysql4.1:
    image: vettadock/mysql-old:4.1
    platform: linux/amd64
    ports:
      - 3309:3306
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2017-latest-ubuntu"
    platform: linux/amd64
    volumes:
      - mssql:/var/opt/mssql/data
      - ./dev/docker_sqlserver:/docker_init
    environment:
      ACCEPT_EULA: "Y"
      MSSSQL_PID: "Express"
      SA_PASSWORD: "Example@1"
    ports:
      - 1433:1433
    command: sh -c ' chmod +x /docker_init/entrypoint.sh; /docker_init/entrypoint.sh & /opt/mssql/bin/sqlservr;'
  sqlserverlatin:
    image: 'mcr.microsoft.com/mssql/server:2017-latest-ubuntu'
    platform: linux/amd64
    volumes:
      - mssqllatin:/var/opt/mssql/data
      - ./dev/docker_sqlserver:/docker_init
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: Example@1"
      MSSQL_COLLATION: Latin1_General_CS_AS
      MSSQL_PID: "Express"
    ports:
      - 1434:1433
    command: sh -c ' chmod +x /docker_init/entrypoint.sh; /docker_init/entrypoint.sh & /opt/mssql/bin/sqlservr;'
  cockroachdb:
    image: cockroachdb/cockroach:v22.1.1
    platform: linux/amd64
    volumes:
      - cockroachdb:/cockroach/cockroach-data
    ports:
      - 26257:26257
    command: start-single-node --insecure
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    platform: linux/amd64
    volumes:
      - ./dev/docker_bigquery:/data
      - ./dev/docker_bigquery:/docker_init
    ports:
      - 9050:9050
      - 9060:9060
    entrypoint: sh -c 'chmod +x /docker_init/data.sh; /docker_init/data.sh'
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis:/data
      - ./dev/docker_redis:/docker_init
    command: sh -c 'redis-server & sleep 3 && /docker_init/data.sh && wait'

  starrocks:
    image: starrocks/allin1-ubuntu
    ports:
      - 9030:9030
      - 8030:8030
      - 8040:8040
    volumes:
      - starrocks:/data/deploy/starrocks
      - ./dev/docker_starrocks/init.sh:/init.sh:ro
    command: ["bash", "/init.sh"]
